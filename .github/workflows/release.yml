name: release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  queue: max

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $stableTag = '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if (git tag --points-at $env:GITHUB_SHA | Where-Object { $_ -cmatch $stableTag }) {
            Write-Host 'This commit already has a version tag.'
            return
          }
          $latestTag = @(git tag --list --sort=version:refname |
            Where-Object { $_ -cmatch $stableTag })[-1]
          if (-not $latestTag) { $latestTag = 'v0.0.0' }
          $major, $minor, $patch = $latestTag.Substring(1).Split('.')
          $version = "$major.$minor.$([long]$patch + 1)"
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "publish=true" >> $env:GITHUB_OUTPUT

  build:
    needs: version
    if: needs.version.outputs.tag != ''
    uses: ./.github/workflows/build.yml
    with:
      sign: true
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

  release:
    needs: [version, build]
    if: needs.version.outputs.publish == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: release

      - name: Publish signed packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $packages = @(Get-ChildItem -LiteralPath 'release' -Filter '*.zip')
          if ($packages.Count -ne 2) { throw 'Expected x64 and ARM64 packages.' }
          $checksums = foreach ($package in $packages) {
            $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($package.Name)"
          }
          $checksums | Set-Content -LiteralPath 'release\checksums.txt' -Encoding utf8NoBOM
          $assets = @($packages.FullName) + @('release\checksums.txt')
          gh release create $env:RELEASE_TAG @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "WAKU Screensaver $env:RELEASE_TAG" --generate-notes

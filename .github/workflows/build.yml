name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      sign:
        type: boolean
        default: false
    secrets:
      AZURE_CLIENT_ID:
        required: false
      AZURE_CLIENT_SECRET:
        required: false
      AZURE_TENANT_ID:
        required: false

permissions:
  contents: read

jobs:
  analyze:
    name: C++ static analysis
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: MSVC analysis and clang-tidy
        run: .\tools\check.ps1 -Architecture x64 -Analyze

      - name: Upload analysis logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-analysis-logs
          path: build\x64-release-analyze\*.log
          if-no-files-found: ignore

  build:
    name: build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test
        run: .\tools\check.ps1 -Architecture '${{ matrix.arch }}'

      - name: Package unsigned CI artifact
        if: inputs.sign != true
        run: .\tools\package.ps1 -Architecture '${{ matrix.arch }}'

      - name: Sign and package release
        if: inputs.sign == true
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: .\tools\package.ps1 -Architecture '${{ matrix.arch }}' -Sign

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.arch }}
          path: out/waku-screensaver-${{ matrix.arch }}.zip
          if-no-files-found: error
